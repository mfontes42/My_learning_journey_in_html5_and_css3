<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio de tabelas</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <table>
        <thead>
            <tr>
                <th colspan="5">Tabela 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="4" class="segunda">A</td>
                <td rowspan="4" class="primeira">B</td>
            </tr>
            <tr>
                <td rowspan="4" class="primeira">C</td>
                <td>D</td>
                <td>E</td>
                <td>F</td>
            </tr>
            <tr>
                <td>G</td>
                <td>H</td>
                <td>I</td>
            </tr>
            <tr>
                <td>J</td>
                <td>L</td>
                <td>M</td>
            </tr>
            <tr>
                <td colspan="4" class="segunda">N</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
