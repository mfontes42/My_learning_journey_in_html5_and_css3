<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas grandes</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <style>
        table {
            border-top: 2px solid black;
            border-bottom: 2px solid black;
            border-collapse: collapse;
            width: 400px;
        }
        thead, tfoot,tfoot td {
            border: 1px solid black;
            background-color: rgb(142, 154, 168);
            color: white;
        }
        td {
            background-color: rgb(236, 234, 234);
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        .num {
            text-align: right;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Estado</th>
                <th>Populacao</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Sao Paulo</td>
                <td class="num">45.99902</td>
            </tr>
            <tr>
                <td>Minas gerais</td>
                <td class="num">21.9038</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td class="num">17.74233</td>
            </tr>
            <tr>
                <td>Amazonas</td>
                <td class="num">4.78469</td>
            </tr>
            <tr>
                <td>Goias</td>
                <td class="num">89.98456</td>
            </tr>
            <tr>
                <td>Piaui</td>
                <td class="num">58.94873</td>
            </tr>
            <tr>
                <td>Goiania</td>
                <td class="num">7.98783</td>
            </tr>
            <tr>
                <td>Rio Grande</td>
                <td class="num">33.22222</td>
            </tr>
            <tr>
                <td>Belem</td>
                <td class="num">6.97462</td>
            </tr>
        </tbody>
        <tfoot>
            <th>Total de habitantes</th>
            <td class="num"><strong>32887656887</strong></td>
        </tfoot>
    </table>
</body>
</html>
