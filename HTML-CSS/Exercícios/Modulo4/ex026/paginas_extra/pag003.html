<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body style="background-color: rgb(1, 134, 134)">
    <a href="#" onclick="clicou()">Clique em mim</a>
    <div id="saida"></div>
    <script>
        function clicou() {
            s = window.document.getElementById("saida")
            s.innerHTML += '<p>vaoce clicou na saida</p>'
        }
    </script>
</body>
</html>
